<!doctype html>
<html lang="ar" dir="rtl">
<head>

<div id="app">
<header class="app-header"><button class="icon-btn" onclick="openDrawer()">☰</button><a class="brand" href="#" onclick="showScreen('home');return false"><span class="brand-mark"><img src="assets/icon.svg" alt="SIHATI"></span><span>SIHATI</span></a><div class="header-actions"><button class="icon-btn" onclick="toggleLanguage()" id="langBtn">FR</button><button class="icon-btn notification-btn" onclick="showScreen('notifications')">🔔<i id="notifDot"></i></button></div></header>
<main id="screenRoot"></main>
<nav class="bottom-nav" id="bottomNav"><button data-screen="home" onclick="showScreen('home')"><span>⌂</span><small data-t="home">الرئيسية</small></button><button data-screen="search" onclick="showScreen('search')"><span>⌕</span><small data-t="search">البحث</small></button><button data-screen="appointments" onclick="showScreen('appointments')"><span>▣</span><small data-t="appointments">المواعيد</small></button><button data-screen="notifications" onclick="showScreen('notifications')"><span>🔔</span><small data-t="notifications">الإشعارات</small></button><button data-screen="profile" onclick="showScreen('profile')"><span>◉</span><small data-t="account">حسابي</small></button></nav>
